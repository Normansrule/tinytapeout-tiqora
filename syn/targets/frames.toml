# frames.toml — the fixed chip frames a carrier target plugs into.
#
# Shared, byte-identical in both repos (docs/shared_flow.sha256).
# A frame is someone else's padframe with a fixed user-project wrapper:
# its module name, port list, die size and wrapper floorplan cannot change.
# The port lists are not typed here: `tapeout.py refresh-frames` extracts
# them from the pinned upstream files into frames.json, and `tapeout.py
# check` compares every generated wrapper against that list.
#
# Everything else below is copied from the pinned upstream files named in
# each entry.

[caravel]
description = "Efabless Caravel user project area (chipIgnite harness; ChipFoundry maintains a fork, chipfoundry/caravel_user_project, not pinned here)"
module = "user_project_wrapper"
repo = "https://github.com/efabless/caravel_user_project"
commit = "f534826abc72af4f9d467446b8b82c9471df68da"
file = "verilog/rtl/user_project_wrapper.v"
# MPRJ_IO_PADS comes from caravel's defines.v, which caravel_user_project
# includes from the caravel checkout.
defines_repo = "https://github.com/efabless/caravel"
defines_commit = "27cbe49c90ba5362ad52c9968dd98e035c30c74f"
defines_file = "verilog/rtl/defines.v"
pdk = "sky130A"
die_um = [2920.0, 3520.0]           # openlane/user_project_wrapper/config.json DIE_AREA
def_template = "openlane/user_project_wrapper/fixed_dont_change/user_project_wrapper.def"
pad_in = "io_in"
pad_out = "io_out"
pad_oeb = "io_oeb"
# "GPIO[5] to GPIO[37] require configuration, while GPIO[0] to GPIO[4] are
# preset and cannot be changed." (caravel_user_project docs/source/index.md
# line 130). The user design leaves pads 0-4 alone.
reserved_pads = [0, 1, 2, 3, 4]
core_inputs = ["wb_clk_i", "wb_rst_i"]
power = { vdd = "vccd1", gnd = "vssd1" }
wrapper_vdd_nets = ["vccd1", "vccd2", "vdda1", "vdda2"]
wrapper_gnd_nets = ["vssd1", "vssd2", "vssa1", "vssa2"]
# user_defines.v power-on mode per pad (verilog/rtl/user_defines.v)
gpio_modes = { in = "GPIO_MODE_USER_STD_INPUT_NOPULL", out = "GPIO_MODE_USER_STD_OUTPUT", io = "GPIO_MODE_USER_STD_BIDIRECTIONAL", unused = "GPIO_MODE_MGMT_STD_INPUT_NOPULL" }
gpio_mode_first = 5
# PDN of the fixed wrapper, from openlane/user_project_wrapper/config.json,
# renamed to LibreLane 3 variables.
# The wrapper has no standard-cell rows to power, so upstream turns off every
# step that adds cells (openlane/user_project_wrapper/config.json:
# PL_RESIZER_DESIGN_OPTIMIZATIONS, PL_RESIZER_TIMING_OPTIMIZATIONS,
# GLB_RESIZER_* = 0, PL_RESIZER_BUFFER_INPUT_PORTS = 0, GRT_REPAIR_ANTENNAS = 0),
# here under their LibreLane 3 names, plus output-port buffering. Without
# them LibreLane buffers the ports and adds diodes that nothing powers, and
# its IR-drop step stops (PSM-0069, targets run 44634901295, caravel-sky130).
# LibreLane 3 also repairs antennas inside detailed routing
# (DRT_ANTENNA_REPAIR_ITERS, which OpenLane 2 did not have); with that left on,
# 89 diodes still went in (targets run 44637392833). Antenna violations are
# then left for gate G3 to report.
wrapper_librelane = { RUN_POST_GPL_DESIGN_REPAIR = false, RUN_POST_CTS_RESIZER_TIMING = false, RUN_POST_GRT_DESIGN_REPAIR = false, RUN_POST_GRT_RESIZER_TIMING = false, DESIGN_REPAIR_BUFFER_INPUT_PORTS = false, DESIGN_REPAIR_BUFFER_OUTPUT_PORTS = false, RUN_ANTENNA_REPAIR = false, DRT_ANTENNA_REPAIR_ITERS = 0, PDN_CORE_RING = 1, PDN_CORE_RING_VWIDTH = 3.1, PDN_CORE_RING_HWIDTH = 3.1, PDN_CORE_RING_VOFFSET = 12.45, PDN_CORE_RING_HOFFSET = 12.45, PDN_CORE_RING_VSPACING = 1.7, PDN_CORE_RING_HSPACING = 1.7, PDN_VWIDTH = 3.1, PDN_HWIDTH = 3.1, PDN_VSPACING = 15.5, PDN_HSPACING = 15.5, PDN_VPITCH = 180, PDN_HPITCH = 180, PDN_VOFFSET = 5, PDN_HOFFSET = 5, RT_MAX_LAYER = "met4" }

[openframe]
description = "Efabless Openframe: the bare padframe, 44 GPIO, no management core (the frame Tiny Tapeout's sky130 chips use)"
module = "openframe_project_wrapper"
repo = "https://github.com/efabless/caravel_openframe_project"
commit = "c3946a4fc3a2d1efe840b92b9ad954068c7cd52d"
file = "verilog/rtl/openframe_project_wrapper.v"
defines_repo = "https://github.com/efabless/caravel"
defines_commit = "27cbe49c90ba5362ad52c9968dd98e035c30c74f"
defines_file = "verilog/rtl/defines.v"
pdk = "sky130A"
die_um = [3166.63, 4766.63]         # openlane/openframe_project_wrapper/config.json DIE_AREA
def_template = "openlane/openframe_project_wrapper/fixed_dont_change/openframe_project_wrapper.def"
# That template declares its 14 supply pins as plain signal pins, so
# LibreLane's template step expects matching signal ports and stops
# ("vccd1 not found in design layout", targets run 44637392833). The
# Caravel template marks its supply pins + USE POWER / GROUND, and LibreLane
# then leaves them out of the match. tapeout.py writes a copy of this
# template with these pins marked that way (vss* GROUND, the rest POWER) and
# nothing else changed: targets/.upstream/openframe.template.def.
template_power_pins = ["vdda", "vdda1", "vdda2", "vssa", "vssa1", "vssa2", "vccd", "vccd1", "vccd2", "vssd", "vssd1", "vssd2", "vddio", "vssio"]
pad_in = "gpio_in"
pad_out = "gpio_out"
pad_oeb = "gpio_oeb"
reserved_pads = []
core_inputs = ["porb_l", "resetb_l"]
power = { vdd = "vccd1", gnd = "vssd1" }
wrapper_vdd_nets = ["vccd1"]
wrapper_gnd_nets = ["vssd1"]
# Digital mode per pad role, from the openframe example's CONFIG_GPIO_INIT
# (verilog/rtl/picosoc.v lines 505-550) decoded with gpio_wb.v's bit map:
# 12'h4c1 input (dm 001, input on), 12'h2c6 output (dm 110, input off),
# 12'h006 bidirectional (dm 110, input on).
pad_dm = { in = 1, out = 6, io = 6, unused = 1 }
pad_inp_dis = { in = 0, out = 1, io = 0, unused = 0 }
# Static pad controls, split the way upstream splits them. The wrapper ties
# loopback_zero straight to the pads' own gpio_loopback_zero, as upstream's
# wrapper does (verilog/rtl/openframe_project_wrapper.v lines 138-141); the
# core drives core_zero to 0, as upstream's example SoC drives them (lines
# 117-119). Tying all seven in the wrapper put eight pins on each pad's
# loopback net, and 24 of the left-edge ones then had no router access point
# (DRT-1231, runs 44641290197 and 44643652345); fewer pins per net is the
# suspected fix, not yet confirmed by a run.
loopback_zero = ["gpio_analog_en", "gpio_analog_pol", "gpio_analog_sel", "gpio_holdover"]
core_zero = ["gpio_ib_mode_sel", "gpio_vtrip_sel", "gpio_slow_sel"]
# The upstream wrapper ties four pad-control buses straight to the pads'
# own gpio_loopback_zero (verilog/rtl/openframe_project_wrapper.v lines
# 138-141), and so does the generated one (loopback_zero above). These are
# port-to-port wires, which Yosys can only write as assign statements, and LibreLane 3 stops on those by default (Checker.
# NetlistAssignStatements). They are allowed here and nowhere else; the
# wrapper's LVS gate (G3) still has to show the layout wires them.
# Antenna repair is off in this stage too: OpenROAD's diode insertion
# crashed on the wrapper ("Unable to repair antennas on net with diodes",
# then a stack trace; targets run 44640065735), where upstream had
# GRT_REPAIR_ANTENNAS = 1 under OpenLane 2. Antenna violations are left for
# gate G3 to report.
wrapper_librelane = { ERROR_ON_NL_ASSIGN_STATEMENTS = false, RUN_ANTENNA_REPAIR = false, DRT_ANTENNA_REPAIR_ITERS = 0, PDN_CORE_RING = 1, PDN_CORE_RING_VWIDTH = 20, PDN_CORE_RING_HWIDTH = 20, PDN_CORE_RING_VOFFSET = -4, PDN_CORE_RING_HOFFSET = -4, PDN_CORE_RING_VSPACING = 2.4, PDN_CORE_RING_HSPACING = 2.4, PDN_VWIDTH = 6.4, PDN_HWIDTH = 6.4, PDN_VSPACING = 3.2, PDN_HSPACING = 3.2, PDN_VPITCH = 40, PDN_HPITCH = 40, PDN_VOFFSET = 18.43, PDN_HOFFSET = 22.83 }

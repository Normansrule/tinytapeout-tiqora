name: gds

on:
  push:
  workflow_dispatch:

jobs:
  gds:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Build GDS
        uses: TinyTapeout/tt-gds-action@ttsky26d
        with:
          pdk: sky130A

      # The flow's summary only says which corners violate. Print the signoff numbers
      # themselves, so the docs can quote this run instead of a local one.
      - name: Signoff timing per corner
        if: always()
        shell: bash
        run: |
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json, os
          p = "runs/wokwi/final/metrics.json"
          if not os.path.exists(p):
              raise SystemExit(f"{p} missing: the flow did not finish")
          m = json.load(open(p))
          g = lambda k: m.get(k, "n/a")
          corners = sorted({k.split("corner:")[1] for k in m if k.startswith("timing__setup__ws__corner:")})
          print("| corner | setup slack (ns) | setup violations | hold slack (ns) | hold violations | max-slew violations |")
          print("|---|---:|---:|---:|---:|---:|")
          for c in corners:
              print(f"| {c} | {g('timing__setup__ws__corner:' + c)} | {g('timing__setup_vio__count__corner:' + c)} | "
                    f"{g('timing__hold__ws__corner:' + c)} | {g('timing__hold_vio__count__corner:' + c)} | "
                    f"{g('design__max_slew_violation__count__corner:' + c)} |")
          print()
          for k in ["timing__setup__ws", "timing__hold__ws", "design__instance__utilization", "design__instance__count__stdcell",
                    "route__drc_errors", "magic__drc_error__count", "design__lvs_error__count", "route__antenna_violation__count"]:
              print(f"- {k}: {g(k)}")
          PY

  precheck:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - name: Run Tiny Tapeout Precheck
        uses: TinyTapeout/tt-gds-action/precheck@ttsky26d

  gl_test:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: GL test
        uses: TinyTapeout/tt-gds-action/gl_test@ttsky26d

  # The Tiny Tapeout template's "viewer" job (a 3D GDS viewer) also deployed to GitHub Pages and
  # would replace the explorer site published by pages.yaml. It is left out; the GDS itself is in
  # this workflow's artifacts.

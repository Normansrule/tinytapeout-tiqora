<svg xmlns='http://www.w3.org/2000/svg' width='460' height='270' viewBox='0 0 460 270' role='img' aria-label='Driven over USB serial: Commands at 115,200 baud: a ping answers 5A 01, a register write answers 06.'><title>Driven over USB serial: Commands at 115,200 baud: a ping answers 5A 01, a register write answers 06.</title><style>svg{--bg:#ffffff;--edge:#d0d7de;--ink:#1f2328;--ink2:#59636e;--dim:#d8dee4;--box:#f6f8fa;--hi:#bf6a00;--ok:#1a7f37;--acc:#0969da}@media (prefers-color-scheme:dark){svg{--bg:#0d1117;--edge:#3d444d;--ink:#e6edf3;--ink2:#9198a1;--dim:#30363d;--box:#151b23;--hi:#ffb000;--ok:#3fb950;--acc:#4493f8}}.bg{fill:var(--bg);stroke:var(--edge)}.t{font:700 22px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;fill:var(--ink);letter-spacing:-.3px}.e{font:600 11px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;fill:var(--hi);letter-spacing:1.4px}.l{font:400 13.5px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;fill:var(--ink2)}.m{font:500 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;fill:var(--ink2)}.mb{font:700 17px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;fill:var(--ink)}.box{fill:var(--box);stroke:var(--edge)}.dim{stroke:var(--dim);fill:none}.hi{stroke:var(--hi);fill:none}.hif{fill:var(--hi)}.okf{fill:var(--ok)}.dimf{fill:var(--dim)}.acc{stroke:var(--acc);fill:none}.pill{fill:none;stroke:var(--hi)}@media (prefers-reduced-motion:no-preference){.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.1s cubic-bezier(.23,1,.32,1) .25s forwards}@keyframes draw{to{stroke-dashoffset:0}}.rise{opacity:0;animation:rise .55s cubic-bezier(.23,1,.32,1) forwards;animation-delay:calc(var(--d,0)*90ms + 200ms)}@keyframes rise{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}.grow{transform-box:fill-box;transform-origin:left;transform:scaleX(0);animation:grow .9s cubic-bezier(.23,1,.32,1) forwards;animation-delay:calc(var(--d,0)*110ms + 250ms)}@keyframes grow{to{transform:none}}}</style><rect class="bg" x=".5" y=".5" width="459" height="269" rx="16"/><text class="e" x="40" y="42">NO CPU</text><rect class="pill" x="338" y="27" width="82" height="22" rx="11"/><text class="e" x="411" y="42" text-anchor="end" style='letter-spacing:.4px'>recorded</text><text class="t" x="40" y="72">Driven over USB serial</text><text class="m" x="40" y="102">ping</text><g class="rise" style='--d:0'><rect class="box" x="40" y="110" width="34" height="28" rx="6"/><text class="m" x="57" y="129" text-anchor="middle">03</text></g><text class="m" x="84" y="129">→</text><g class="rise" style='--d:6'><rect class='box' x="102" y="110" width="34" height="28" rx="6" style='stroke:var(--hi)'/><text class="m" x="119" y="129" text-anchor="middle">5A</text></g><g class="rise" style='--d:7'><rect class='box' x="140" y="110" width="34" height="28" rx="6" style='stroke:var(--hi)'/><text class="m" x="157" y="129" text-anchor="middle">01</text></g><text class="m" x="40" y="154">write CFG = 0x00000001</text><g class="rise" style='--d:6'><rect class="box" x="40" y="162" width="34" height="28" rx="6"/><text class="m" x="57" y="181" text-anchor="middle">01</text></g><g class="rise" style='--d:7'><rect class="box" x="78" y="162" width="34" height="28" rx="6"/><text class="m" x="95" y="181" text-anchor="middle">03</text></g><g class="rise" style='--d:8'><rect class="box" x="116" y="162" width="34" height="28" rx="6"/><text class="m" x="133" y="181" text-anchor="middle">01</text></g><g class="rise" style='--d:9'><rect class="box" x="154" y="162" width="34" height="28" rx="6"/><text class="m" x="171" y="181" text-anchor="middle">00</text></g><g class="rise" style='--d:10'><rect class="box" x="192" y="162" width="34" height="28" rx="6"/><text class="m" x="209" y="181" text-anchor="middle">00</text></g><g class="rise" style='--d:11'><rect class="box" x="230" y="162" width="34" height="28" rx="6"/><text class="m" x="247" y="181" text-anchor="middle">00</text></g><text class="m" x="274" y="181">→</text><g class="rise" style='--d:12'><rect class='box' x="292" y="162" width="34" height="28" rx="6" style='stroke:var(--hi)'/><text class="m" x="309" y="181" text-anchor="middle">06</text></g><text class="l" x="40" y="222">Commands at 115,200 baud: a ping answers 5A 01,</text><text class="l" x="40" y="242">a register write answers 06.</text></svg>

<svg xmlns='http://www.w3.org/2000/svg' width='460' height='270' viewBox='0 0 460 270' role='img' aria-label='Two tiles, 140 €: 21,322 µm² of standard cells, 59% of the 1 × 2 die, measured with Yosys 0.33 before placement.'><title>Two tiles, 140 €: 21,322 µm² of standard cells, 59% of the 1 × 2 die, measured with Yosys 0.33 before placement.</title><style>svg{--bg:#ffffff;--edge:#d0d7de;--ink:#1f2328;--ink2:#59636e;--dim:#d8dee4;--box:#f6f8fa;--hi:#bf6a00;--ok:#1a7f37;--acc:#0969da}@media (prefers-color-scheme:dark){svg{--bg:#0d1117;--edge:#3d444d;--ink:#e6edf3;--ink2:#9198a1;--dim:#30363d;--box:#151b23;--hi:#ffb000;--ok:#3fb950;--acc:#4493f8}}.bg{fill:var(--bg);stroke:var(--edge)}.t{font:700 22px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;fill:var(--ink);letter-spacing:-.3px}.e{font:600 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;fill:var(--hi)}.l{font:400 13.5px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;fill:var(--ink2)}.m{font:500 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;fill:var(--ink2)}.mb{font:700 17px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;fill:var(--ink)}.box{fill:var(--box);stroke:var(--edge)}.dim{stroke:var(--dim);fill:none}.hi{stroke:var(--hi);fill:none}.hif{fill:var(--hi)}.okf{fill:var(--ok)}.dimf{fill:var(--dim)}.acc{stroke:var(--acc);fill:none}.pill{fill:none;stroke:var(--hi)}@media (prefers-reduced-motion:no-preference){.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.1s cubic-bezier(.23,1,.32,1) .25s forwards}@keyframes draw{to{stroke-dashoffset:0}}.rise{opacity:0;animation:rise .55s cubic-bezier(.23,1,.32,1) forwards;animation-delay:calc(var(--d,0)*90ms + 200ms)}@keyframes rise{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}.grow{transform-box:fill-box;transform-origin:left;transform:scaleX(0);animation:grow .9s cubic-bezier(.23,1,.32,1) forwards;animation-delay:calc(var(--d,0)*110ms + 250ms)}@keyframes grow{to{transform:none}}}</style><rect class="bg" x=".5" y=".5" width="459" height="269" rx="16"/><text class="e" x="40" y="42">Tiny Tapeout</text><rect class="pill" x="338" y="27" width="82" height="22" rx="11"/><text class="e" x="411" y="42" text-anchor="end" style='font-size:11.5px'>measured</text><text class="t" x="40" y="72">Two tiles, 140 €</text><rect class="box" x="40" y="92" width="64" height="76" rx="6"/><rect class="hif" style='opacity:.22' x="41" y="123.3" width="62" height="43.7" rx="5"/><line class="dim" x1="40" y1="130" x2="104" y2="130" stroke-dasharray='3 3'/><text class="m" x="140" y="102">standard cells</text><rect class="dimf" x="140" y="114" width="280" height="16" rx="8"/><rect class='hif grow' x="140" y="114" width="165.2" height="16" rx="8"/><text class="mb" x="140" y="158">59%</text><text class="m" x="190" y="158">of the die</text><text class="m" x="40" y="186">1 × 2 tiles</text><text class="l" x="40" y="222">21,322 µm² of standard cells, 59% of the 1 × 2 die,</text><text class="l" x="40" y="242">measured with Yosys 0.33 before placement.</text></svg>

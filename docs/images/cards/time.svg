<svg xmlns='http://www.w3.org/2000/svg' width='460' height='270' viewBox='0 0 460 270' role='img' aria-label='Triggers on the exact tick: TRIG0 rises on exactly the tick written over serial, however busy the host is.'><title>Triggers on the exact tick: TRIG0 rises on exactly the tick written over serial, however busy the host is.</title><style>svg{--bg:#ffffff;--edge:#d0d7de;--ink:#1f2328;--ink2:#59636e;--dim:#d8dee4;--box:#f6f8fa;--hi:#bf6a00;--ok:#1a7f37;--acc:#0969da}@media (prefers-color-scheme:dark){svg{--bg:#0d1117;--edge:#3d444d;--ink:#e6edf3;--ink2:#9198a1;--dim:#30363d;--box:#151b23;--hi:#ffb000;--ok:#3fb950;--acc:#4493f8}}.bg{fill:var(--bg);stroke:var(--edge)}.t{font:700 22px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;fill:var(--ink);letter-spacing:-.3px}.e{font:600 11px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;fill:var(--hi);letter-spacing:1.4px}.l{font:400 13.5px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;fill:var(--ink2)}.m{font:500 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;fill:var(--ink2)}.mb{font:700 17px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;fill:var(--ink)}.box{fill:var(--box);stroke:var(--edge)}.dim{stroke:var(--dim);fill:none}.hi{stroke:var(--hi);fill:none}.hif{fill:var(--hi)}.okf{fill:var(--ok)}.dimf{fill:var(--dim)}.acc{stroke:var(--acc);fill:none}.pill{fill:none;stroke:var(--hi)}@media (prefers-reduced-motion:no-preference){.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.1s cubic-bezier(.23,1,.32,1) .25s forwards}@keyframes draw{to{stroke-dashoffset:0}}.rise{opacity:0;animation:rise .55s cubic-bezier(.23,1,.32,1) forwards;animation-delay:calc(var(--d,0)*90ms + 200ms)}@keyframes rise{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}.grow{transform-box:fill-box;transform-origin:left;transform:scaleX(0);animation:grow .9s cubic-bezier(.23,1,.32,1) forwards;animation-delay:calc(var(--d,0)*110ms + 250ms)}@keyframes grow{to{transform:none}}}</style><rect class="bg" x=".5" y=".5" width="459" height="269" rx="16"/><text class="e" x="40" y="42">DEADLINES</text><rect class="pill" x="338" y="27" width="82" height="22" rx="11"/><text class="e" x="411" y="42" text-anchor="end" style='letter-spacing:.4px'>recorded</text><text class="t" x="40" y="72">Triggers on the exact tick</text><line class="dim" x1="40" y1="172" x2="420" y2="172" stroke-width="1"/><text class="m" x="40" y="128">TRIG0</text><path class='hi draw' pathLength="1" stroke-width="3" stroke-linejoin="round" d='M40.0,158 L62.4,158 L84.7,158 L107.1,158 L129.4,158 L151.8,158 L174.1,158 L196.5,158 L196.5,112 L218.8,112 L241.2,112 L263.5,112 L285.9,112 L308.2,112 L330.6,112 L352.9,112 L375.3,112 L375.3,158 L397.6,158 L420.0,158'/><line class="acc" x1="196.5" y1="98" x2="196.5" y2="178" stroke-width="1.5" stroke-dasharray='3 3'/><text class="m" x="202.5" y="108">tick 111,242</text><text class="l" x="40" y="222">TRIG0 rises on exactly the tick written over serial,</text><text class="l" x="40" y="242">however busy the host is.</text></svg>

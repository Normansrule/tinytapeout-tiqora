<svg xmlns='http://www.w3.org/2000/svg' width='460' height='270' viewBox='0 0 460 270' role='img' aria-label='Evidence on every number: Each result says measured, experimental, failed or not done, with the command and version behind it.'><title>Evidence on every number: Each result says measured, experimental, failed or not done, with the command and version behind it.</title><style>svg{--bg:#ffffff;--edge:#d0d7de;--ink:#1f2328;--ink2:#59636e;--dim:#d8dee4;--box:#f6f8fa;--hi:#bf6a00;--ok:#1a7f37;--acc:#0969da}@media (prefers-color-scheme:dark){svg{--bg:#0d1117;--edge:#3d444d;--ink:#e6edf3;--ink2:#9198a1;--dim:#30363d;--box:#151b23;--hi:#ffb000;--ok:#3fb950;--acc:#4493f8}}.bg{fill:var(--bg);stroke:var(--edge)}.t{font:700 22px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;fill:var(--ink);letter-spacing:-.3px}.e{font:600 11px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;fill:var(--hi);letter-spacing:1.4px}.l{font:400 13.5px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;fill:var(--ink2)}.m{font:500 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;fill:var(--ink2)}.mb{font:700 17px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;fill:var(--ink)}.box{fill:var(--box);stroke:var(--edge)}.dim{stroke:var(--dim);fill:none}.hi{stroke:var(--hi);fill:none}.hif{fill:var(--hi)}.okf{fill:var(--ok)}.dimf{fill:var(--dim)}.acc{stroke:var(--acc);fill:none}.pill{fill:none;stroke:var(--hi)}@media (prefers-reduced-motion:no-preference){.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.1s cubic-bezier(.23,1,.32,1) .25s forwards}@keyframes draw{to{stroke-dashoffset:0}}.rise{opacity:0;animation:rise .55s cubic-bezier(.23,1,.32,1) forwards;animation-delay:calc(var(--d,0)*90ms + 200ms)}@keyframes rise{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}.grow{transform-box:fill-box;transform-origin:left;transform:scaleX(0);animation:grow .9s cubic-bezier(.23,1,.32,1) forwards;animation-delay:calc(var(--d,0)*110ms + 250ms)}@keyframes grow{to{transform:none}}}</style><rect class="bg" x=".5" y=".5" width="459" height="269" rx="16"/><text class="e" x="40" y="42">EVIDENCE</text><rect class="pill" x="338" y="27" width="82" height="22" rx="11"/><text class="e" x="411" y="42" text-anchor="end" style='letter-spacing:.4px'>measured</text><text class="t" x="40" y="72">Evidence on every number</text><text class="m" x="40" y="98">FPGA simulation</text><rect class="dimf" x="290" y="88" width="110" height="11" rx="5.5"/><rect class='okf grow' style='--d:0' x="290" y="88" width="110.0" height="11" rx="5.5"/><text class="m" x="408" y="98">2/2</text><text class="m" x="40" y="115">Basys 3 board</text><rect class="dimf" x="290" y="105" width="110" height="11" rx="5.5"/><text class="m" x="408" y="115">0/2</text><text class="m" x="40" y="132">Tiny Tapeout GDS and pre-flight</text><rect class="dimf" x="290" y="122" width="110" height="11" rx="5.5"/><rect class='okf grow' style='--d:2' x="290" y="122" width="110.0" height="11" rx="5.5"/><text class="m" x="408" y="132">3/3</text><text class="m" x="40" y="149">sky130 timing</text><rect class="dimf" x="290" y="139" width="110" height="11" rx="5.5"/><rect class='okf grow' style='--d:3' x="290" y="139" width="110.0" height="11" rx="5.5"/><text class="m" x="408" y="149">1/1</text><text class="m" x="40" y="166">Silicon</text><rect class="dimf" x="290" y="156" width="110" height="11" rx="5.5"/><text class="m" x="408" y="166">0/2</text><text class="l" x="40" y="222">Each result says measured, experimental, failed or not done,</text><text class="l" x="40" y="242">with the command and version behind it.</text></svg>

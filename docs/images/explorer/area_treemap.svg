<svg xmlns='http://www.w3.org/2000/svg' viewBox='-2 -2 764 1109.6993788819875' role='img' aria-labelledby='tm-t tm-d'><title id='tm-t'>Tiqora-Serial: measured cell area per block, to scale against the 1x2 tile</title><desc id='tm-d'>The outer rectangle is the Tiny Tapeout 1x2 die, 161.0 by 225.76 µm. The inner rectangles add up to the 25,217 µm² of standard cells Yosys synthesis measured, module by module, 69% of the die. Sizes are to scale; positions are not a floorplan.</desc><style>:root { --bg: #f5f5f2; /* paper */ --surface: #fdfdfb; --surface-2: #ebebe6; --ink: #121416; --ink-2: #383d42; --muted: #575d63; --line: #d8d9d3; --line-2: #bcbfb8; --trace: #8f5200; /* the signature: a recorded trace, in amber */ --accent: #0b5f86; /* the probe: links, focus, the cursor, the current selection */ --accent-ink: #ffffff; --button: #121416; /* the primary button is ink, not accent */ --button-ink: #f5f5f2; --focus: #0b5f86; /* signal kinds in the waveform */ --sig-bit: #9a5800; --sig-bus: #0b6e57; --sig-enum: #a3406f; --sig-text: #383d42; --sig-pin: #2e7032; --sig-unknown: #a3a7a2; --cursor: #0b5f86; /* block categories (dataviz palette, validated for colour-vision deficiency) */ --cat-interface: #2a78d6; --cat-compute: #eb6834; --cat-memory: #1baf7a; --cat-timing: #eda100; --cat-control: #e87ba4; --cat-pins: #008300; /* evidence */ --ok: #17703a; --est: #855700; --fail: #b42318; --todo: #575d63; --rec: #0b5f86; /* the screen: code blocks and the die zoom are always the instrument's screen */ --screen: #0b0d0c; --screen-ink: #e5e8e3; --screen-dim: #8e968f; --screen-line: #2a302d; --code-bg: #121416; --code-ink: #e5e8e3; --code-dim: #9aa29b; --radius: 4px; --ease-out: cubic-bezier(0.23, 1, 0.32, 1); --mono: "Atkinson Hyperlegible Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; --sans: "Atkinson Hyperlegible Next", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; --display: "Barlow Semi Condensed", "Atkinson Hyperlegible Next", ui-sans-serif, system-ui, sans-serif; color-scheme: light; } @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #0b0d0c; --surface: #111413; --surface-2: #181c1a; --ink: #e5e8e3; --ink-2: #bcc3bd; --muted: #8e968f; --line: #242927; --line-2: #363d3a; --trace: #ffb000; --accent: #7cc6ea; --accent-ink: #0b0d0c; --button: #e5e8e3; --button-ink: #0b0d0c; --focus: #7cc6ea; --sig-bit: #ffb000; --sig-bus: #5fd0a6; --sig-enum: #e391bd; --sig-text: #bcc3bd; --sig-pin: #8bd17c; --sig-unknown: #4d5651; --cursor: #9ad8f7; --cat-interface: #3987e5; --cat-compute: #d95926; --cat-memory: #199e70; --cat-timing: #c98500; --cat-control: #d55181; --cat-pins: #008300; --ok: #5bd28a; --est: #e8b84a; --fail: #ff7b72; --todo: #8e968f; --rec: #7cc6ea; --code-bg: #070908; --code-ink: #e5e8e3; --code-dim: #8a928b; color-scheme: dark; } } :root[data-theme="dark"] { --bg: #0b0d0c; --surface: #111413; --surface-2: #181c1a; --ink: #e5e8e3; --ink-2: #bcc3bd; --muted: #8e968f; --line: #242927; --line-2: #363d3a; --trace: #ffb000; --accent: #7cc6ea; --accent-ink: #0b0d0c; --button: #e5e8e3; --button-ink: #0b0d0c; --focus: #7cc6ea; --sig-bit: #ffb000; --sig-bus: #5fd0a6; --sig-enum: #e391bd; --sig-text: #bcc3bd; --sig-pin: #8bd17c; --sig-unknown: #4d5651; --cursor: #9ad8f7; --cat-interface: #3987e5; --cat-compute: #d95926; --cat-memory: #199e70; --cat-timing: #c98500; --cat-control: #d55181; --cat-pins: #008300; --ok: #5bd28a; --est: #e8b84a; --fail: #ff7b72; --todo: #8e968f; --rec: #7cc6ea; --code-bg: #070908; --code-ink: #e5e8e3; --code-dim: #8a928b; color-scheme: dark; } .cat-pins { --c: var(--cat-pins); } .cat-interface { --c: var(--cat-interface); } .cat-control { --c: var(--cat-control); } .cat-compute { --c: var(--cat-compute); } .cat-memory { --c: var(--cat-memory); } .cat-timing { --c: var(--cat-timing); } .tm-die { fill: var(--surface-2); stroke: var(--muted); stroke-dasharray: 6 4; stroke-width: 1.5; } .tm-cell { fill: color-mix(in srgb, var(--c) 30%, var(--surface)); stroke: var(--c); stroke-width: 1.5; } .tm-name { font: 700 12px var(--mono); fill: var(--ink); pointer-events: none; } .tm-val, .tm-short { font: 11.5px var(--mono); fill: var(--ink); pointer-events: none; } .tm-note { font: 12px var(--sans); fill: var(--muted); } .fl-chip { fill: var(--surface-2); stroke: var(--line-2); stroke-width: 1.5; } .fl-chiplbl { font: 12px var(--mono); fill: var(--muted); } .fl-col { font: 700 13px var(--sans); fill: var(--ink-2); } .fl-edge { fill: none; stroke: var(--muted); stroke-width: 1.6; } .fl-arrow { fill: var(--muted); } .fl-elbl { font: 12px var(--sans); fill: var(--ink-2); paint-order: stroke; stroke: var(--surface); stroke-width: 4; } .fl-elbl.in { stroke: var(--surface-2); } .fl-node { fill: var(--surface); stroke: var(--c, var(--line-2)); stroke-width: 1.8; } .fl-ext { fill: var(--surface); stroke: var(--line-2); stroke-width: 1.5; stroke-dasharray: 4 3; } .fl-title { font: 700 13.5px var(--sans); fill: var(--ink); } .fl-sub { font: 12px var(--sans); fill: var(--ink-2); }</style><rect x='-2' y='-2' width='764' height='1109.6993788819875' fill='var(--surface)'/><rect class='tm-die' x='0' y='0' width='760' height='1065.6993788819875'/><g><title>Deadline comparators (sync_compare): 7,757 µm²</title><rect class='tm-cell cat-timing' x='64.5' y='90.0' width='396.9' height='431.3'/><text class='tm-name' x='70.5' y='107.0'>sync_compare</text><text class='tm-val' x='70.5' y='122.0'>7,757 µm²</text></g><g><title>Timing unit (sync_unit): 4,553 µm²</title><rect class='tm-cell cat-timing' x='463.4' y='90.0' width='232.1' height='431.3'/><text class='tm-name' x='469.4' y='107.0'>sync_unit</text><text class='tm-val' x='469.4' y='122.0'>4,553 µm²</text></g><g><title>Timebase with rate trim (sync_timebase): 4,380 µm²</title><rect class='tm-cell cat-timing' x='64.5' y='523.4' width='343.9' height='280.2'/><text class='tm-name' x='70.5' y='540.4'>sync_timebase</text><text class='tm-val' x='70.5' y='555.4'>4,380 µm²</text></g><g><title>Serial host port (tp_host_uart): 2,671 µm²</title><rect class='tm-cell cat-interface' x='64.5' y='805.6' width='343.9' height='170.1'/><text class='tm-name' x='70.5' y='822.6'>tp_host_uart</text><text class='tm-val' x='70.5' y='837.6'>2,671 µm²</text></g><g><title>Event queue (sync_event_fifo): 2,655 µm²</title><rect class='tm-cell cat-memory' x='410.4' y='523.4' width='285.1' height='204.0'/><text class='tm-name' x='416.4' y='540.4'>sync_event_fifo</text><text class='tm-val' x='416.4' y='555.4'>2,655 µm²</text></g><g><title>Serial receiver (tp_uart_rx): 1,205 µm²</title><rect class='tm-cell cat-interface' x='410.4' y='729.4' width='201.9' height='129.7'/><text class='tm-name' x='416.4' y='746.4'>tp_uart_rx</text><text class='tm-val' x='416.4' y='761.4'>1,205 µm²</text></g><g><title>Serial transmitter (tp_uart_tx): 1,067 µm²</title><rect class='tm-cell cat-interface' x='410.4' y='861.1' width='201.9' height='114.6'/><text class='tm-name' x='416.4' y='878.1'>tp_uart_tx</text><text class='tm-val' x='416.4' y='893.1'>1,067 µm²</text></g><g><title>Capture lanes (sync_capture): 891 µm²</title><rect class='tm-cell cat-timing' x='614.3' y='729.4' width='81.2' height='236.6'/><text class='tm-name' x='620.3' y='746.4'>sync_capture</text><text class='tm-val' x='620.3' y='761.4'>891 µm²</text></g><g><title>Serial system top (tp_sync_soc): 32.5 µm²</title><rect class='tm-cell cat-control' x='614.3' y='968.0' width='72.5' height='7.7'/></g><g><title>Tiny Tapeout pin wrapper (tt_um_normansrule_tiqora_serial): 3.8 µm²</title><rect class='tm-cell cat-pins' x='688.8' y='968.0' width='6.7' height='7.7'/></g><text class='tm-note' x='0' y='1084.6993788819875'>dashed: the 1x2 die, 161.0 × 225.76 µm = 36,347 µm² (Tiny Tapeout template)</text><text class='tm-note' x='0' y='1101.6993788819875'>filled: 25,217 µm² of cells, summed per module (69% of the die) · sizes to scale, positions are not a floorplan</text></svg>

nt-c1 28.50s infinite}@keyframes m-event-c2{0%,25.61%{opacity:0}26.14%,37.02%{opacity:1}37.19%,100%{opacity:0}}.m-event-c2{animation:m-event-c2 28.50s infinite}@keyframes m-event-c3{0%,37.19%{opacity:0}37.72%,48.60%{opacity:1}48.77%,100%{opacity:0}}.m-event-c3{animation:m-event-c3 28.50s infinite}@keyframes m-event-c4{0%,48.77%{opacity:0}49.30%,60.18%{opacity:1}60.35%,100%{opacity:0}}.m-event-c4{animation:m-event-c4 28.50s infinite}@keyframes m-event-c5{0%,60.35%{opacity:0}60.88%,71.75%{opacity:1}71.93%,100%{opacity:0}}.m-event-c5{animation:m-event-c5 28.50s infinite}@keyframes m-event-c6{0%,71.93%{opacity:0}72.46%,99.82%{opacity:1}100.00%,100%{opacity:0}}.m-event-c6{animation:m-event-c6 28.50s infinite}}</style><rect width='880' height='412' rx='12' fill='#0f1214'/><text x='16' y='26' fill='#e8ebe9' font-size='16' font-weight='700'>An edge, queued and read</text><text x='16' y='46' fill='#9aa3a7' font-size='12'>cycles 110392 to 137531 · 542.80 µs at 50 MHz</text><rect x='672.4' y='12' width='193.6' height='20' rx='10' fill='none' stroke='#6ea8f0'/><text x='769.2' y='26' text-anchor='middle' fill='#6ea8f0' font-size='11'>Recorded from RTL simulation</text><line x1='150' y1='90' x2='866' y2='90' stroke='#2c3337' stroke-width='.5'/><text x='16' y='82' fill='#9aa3a7' font-size='12'>RX (ui_in[3])</text><path d='M172.32 71H173.06L173.06 85H195.96L195.96 71H207.41L207.41 85H276.1L276.1 71H287.55L287.55 85H299L299 71H310.45L310.45 85H390.6L390.6 71H848.83L848.83 85H866' fill='none' stroke='#6ea8f0' stroke-width='2'/><line x1='150' y1='114' x2='866' y2='114' stroke='#2c3337' stroke-width='.5'/><text x='16' y='106' fill='#9aa3a7' font-size='12'>TX (uo_out[4])</text><path d='M172.32 95H396.46L396.46 109H419.36L419.36 95H430.81L430.81 109H465.16L465.16 95H476.61L476.61 109H488.06L488.06 95H510.98L510.98 109H533.88L533.88 95H545.33L545.33 109H568.23L568.23 95H591.13L591.13 109H602.58L602.58 95H625.5L625.5 109H636.95L636.95 95H648.4L648.4 109H728.55L728.55 95H740.03L740.03 109H7
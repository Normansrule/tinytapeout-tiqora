='178.98' y='202' fill='#e8ebe9' font-size='11' font-family='ui-monospace,SFMono-Regular,Consolas,Menlo,monospace'>1</text><path d='M396.43 198.0L399.43 191H863L866 198.0L863 205H399.43Z' fill='#161a1d' stroke='#3fc49b'/><text x='402.43' y='202' fill='#e8ebe9' font-size='11' font-family='ui-monospace,SFMono-Regular,Consolas,Menlo,monospace'>0</text><line x1='150' y1='234' x2='866' y2='234' stroke='#2c3337' stroke-width='.5'/><text x='16' y='226' fill='#9aa3a7' font-size='12'>EVCH (uio[4:2])</text><rect x='172.32' y='215' width='0.66' height='14' fill='#3fc49b' opacity='.35'/><path d='M172.98 222.0L175.98 215H393.43L396.43 222.0L393.43 229H175.98Z' fill='#161a1d' stroke='#3fc49b'/><text x='178.98' y='226' fill='#e8ebe9' font-size='11' font-family='ui-monospace,SFMono-Regular,Consolas,Menlo,monospace'>0</text><rect x='396.43' y='216' width='469.57' height='12' fill='#5b656a'/><line x1='150' y1='258' x2='866' y2='258' stroke='#2c3337' stroke-width='.5'/><text x='16' y='250' fill='#9aa3a7' font-size='12'>EVED (uio[5])</text><rect x='172.32' y='240' width='0.66' height='12' fill='#5b656a'/><rect x='396.43' y='240' width='469.57' height='12' fill='#5b656a'/><path d='M172.98 239H396.43' fill='none' stroke='#6ea8f0' stroke-width='2'/><line x1='150' y1='282' x2='866' y2='282' stroke='#2c3337' stroke-width='.5'/><text x='16' y='274' fill='#9aa3a7' font-size='12'>host → chip</text><rect x='173.06' y='262' width='114.5' height='16' rx='3' fill='#161a1d' stroke='#6ea8f0'/><text x='177.06' y='274' fill='#e8ebe9' font-size='11' font-family='ui-monospace,SFMono-Regular,Consolas,Menlo,monospace'>02</text><rect x='287.55' y='262' width='114.5' height='16' rx='3' fill='#161a1d' stroke='#6ea8f0'/><text x='291.55' y='274' fill='#e8ebe9' font-size='11' font-family='ui-monospace,SFMono-Regular,Consolas,Menlo,monospace'>01</text><rect x='848.83' y='262' width='17.17' height='16' rx='3' fill='#161a1d' stroke='#6ea8f0'/><line x1='150' y1='306' x2='866' y2='306' stroke='#2c3337' stroke-width='.5'/><text x='16' y='298' fill='#9aa3a7' font-size='12'>chip → host</text><rect x='396.46' y='286' width='114.5' height='16' rx='3' fill='#161a1d' stroke='#e3a440'/><text x='400.46' y='298' fill='#e8ebe9' font-size='11' font-family='ui-monospace,SFMono-Regular,Consolas,Menlo,monospace'>A2</text><rect x='510.98' y='286' width='114.5' height='16' rx='3' fill='#161a1d' stroke='#e3a440'/><text x='514.98' y='298' fill='#e8ebe9' font-size='11' font-family='ui-monospace,SFMono-Regular,Consolas,Menlo,monospace'>B2</text><rect x='625.5' y='286' width='114.5' height='16' rx='3' fill='#161a1d' stroke='#e3a440'/><text x='629.5' y='298' fill='#e8ebe9' font-size='11' font-family='ui-monospace,SFMono-Regular,Consolas,Menlo,monospace'>01</text><rect x='740.03' y='286' width='114.5' height='16' rx='3' fill='#161a1d' stroke='#e3a440'/><text x='744.03' y='298' fill='#e8ebe9' font-size='11' font-family='ui-monospace,SFMono-Regular,Consolas,Menlo,monospace'>08</text><line x1='172.98' y1='62' x2='172.98' y2='306' stroke='#9aa3a7' stroke-dasharray='3 3'/><text x='175.98' y='319' text-anchor='start' fill='#9aa3a7' font-size='11'>captured</text><line x1='396.43' y1='62' x2='396.43' y2='306' stroke='#9aa3a7' stroke-dasharray='3 3'/><text x='399.43' y='319' text-anchor='start' fill='#9aa3a7' font-size='11'>popped</text><rect class='m-event-curtain' visibility='hidden' x='150' y='60' width='732' height='262' fill='#0f1214'/><line class='m-event-cur' visibility='hidden' x1='150' y1='60' x2='150' y2='306' stroke='#ff7d47' stroke-width='2'/><rect x='0' y='328' width='880' height='84' rx='12' fill='#161a1d'/><rect x='0' y='328' width='880' height='12' fill='#161a1d'/><text class='m-event-sum' x='16' y='350' fill='#e8ebe9' font-size='13'><tspan x='16' dy='0'>An edge on a capture pin becomes a timestamped event: the queue pins show it at once, and a serial read pops it.</tspan></text><text class='m-event-cap m-event-c0' visibility='hidden' x='16' y='350' fill='#e8ebe9' font-size='13'><tspan x='16' dy='0'>CAP0 (ui_in[0]) rises. Capture is enabled for channel 0, rising edges (the CFG write in the first tour).</tspan></text><text class='m-event-cap m-event-c1' visibility='hidden' x='16' y='350' fill='#e8ebe9' font-size='13'><tspan x='16' dy='0'>3 clocks later the edge is through the two-flop synchronizer and the edge detector: EVTP pulses for one clock and EVT</tspan><tspan x='16' dy='18'>goes high.</tspan></text><text class='m-event-cap m-event-c2' visibility='hidden' x='16' y='350' fill='#e8ebe9' font-size='13'><tspan x='16' dy='0'>The board can see the event without asking: EVQ = 1 (one queued), EVCH = 0, EVED = 1 (rising) on the uio pins.</tspan></text><text class='m-event-cap m-event-c3' visibility='hidden' x='16' y='350' fill='#e8ebe9' font-size='13'><tspan x='16' dy='0'>Host sends 02 01: read EVENT.</tspan></text><text class='m-event-cap m-event-c4' visibility='hidden' x='16' y='350' fill='#e8ebe9' font-size='13'><tspan x='16' dy='0'>H_DO: one clock on the register port, offset 1 (EVENT).</tspan></text><text class='m-event-cap m-event-c5' visibility='hidden' x='16' y='350' fill='#e8ebe9' font-size='13'><tspan x='16' dy='0'>Reading EVENT pops the queue on the H_DO clock: EVQ and EVT drop. The word is source 0 (pin), channel 0, rising,</tspan><tspan x='16' dy='18'>timestamp 111266.</tspan></text><text class='m-event-cap m-event-c6' visibility='hidden' x='16' y='350' fill='#e8ebe9' font-size='13'><tspan x='16' dy='0'>The chip answers A2 B2 01 08, least significant byte first: 0x0801B2A2.</tspan></text></svg>

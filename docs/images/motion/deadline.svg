<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 880 388' width='880' height='388' role='img' aria-labelledby='m-deadline-t m-deadline-d' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif'><title id='m-deadline-t'>A deadline set over serial</title><desc id='m-deadline-d'>Write CMP0 over the serial port and the trigger pin rises on exactly that tick, 8 ticks wide, with nothing on the wire. Recorded from an RTL simulation, not computed in the browser. Made by docs/tools/motion.py from docs/site/data/traces/deadline.json.</desc><style>@keyframes m-deadline-sweep{0.00%{transform:translateX(0.0px);animation-timing-function:ease-in-out}2.78%{transform:translateX(9.9px)}13.10%{transform:translateX(9.9px);animation-timing-function:ease-in-out}15.87%{transform:translateX(420.6px)}26.19%{transform:translateX(420.6px);animation-timing-function:ease-in-out}28.97%{transform:translateX(420.6px)}39.29%{transform:translateX(420.6px);animation-timing-function:ease-in-out}42.06%{transform:translateX(420.6px)}52.38%{transform:translateX(420.6px);animation-timing-function:ease-in-out}55.16%{transform:translateX(691.3px)}65.48%{transform:translateX(691.3px);animation-timing-function:ease-in-out}68.25%{transform:translateX(691.4px)}78.57%{transform:translateX(691.4px);animation-timing-function:ease-in-out}84.13%{transform:translateX(716.0px)}99.6%{transform:translateX(716.0px)}100%{transform:translateX(0)}}@media (prefers-reduced-motion:no-preference){.m-deadline-sum{visibility:hidden}.m-deadline-cap,.m-deadline-cur,.m-deadline-curtain{visibility:visible}.m-deadline-cap{opacity:0}.m-deadline-curtain,.m-deadline-cur{animation:m-deadline-sweep 25.20s infinite}@keyframes m-deadline-c0{0%,2.78%{opacity:0}3.37%,15.67%{opacity:1}15.87%,100%{opacity:0}}.m-deadline-c0{animation:m-deadline-c0 25.20s infinite}@keyframes m-deadline-c1{0%,15.87%{opacity:0}16.47%,28.77%{opacity:1}28.97%,100%{opacity:0}}.m-deadline-c1{animation:m-deadline-c1 25.20s infinite}@keyframes m-deadline-c2{0%,28.97%{opacity:0}29.56%,41.87%{opacity:1}42.06%,100%{opacity:0}}.m-deadline-c2{animation:m-deadline-c2 25.20s infinite}@keyframes m-deadline-c3{0%,42.06%{opacity:0}42.66%,54.96%{opacity:1}55.16%,100%{opacity:0}}.m-deadline-c3{animation:m-deadline-c3 25.20s infinite}@keyframes m-deadline-c4{0%,55.16%{opacity:0}55.75%,68.06%{opacity:1}68.25%,100%{opacity:0}}.m-deadline-c4{animation:m-deadline-c4 25.20s infinite}@keyframes m-deadline-c5{0%,68.25%{opacity:0}68.85%,99.80%{opacity:1}100.00%,100%{opacity:0}}.m-deadline-c5{animation:m-deadline-c5 25.20s infinite}}</style><rect width='880' height='388' rx='12' fill='#0f1214'/><text x='16' y='26' fill='#e8ebe9' font-size='16' font-weight='700'>A deadline set over serial</text><text x='16' y='46' fill='#9aa3a7' font-size='12'>cycles 67953 to 112982 · 900.60 µs at 50 MHz</text><rect x='672.4' y='12' width='193.6' height='20' rx='10' fill='none' stroke='#6ea8f0'/><text x='769.2' y='26' text-anchor='middle' fill='#6ea8f0' font-size='11'>Recorded from RTL simulation</text><line x1='150' y1='90' x2='866' y2='90' stroke='#2c3337' stroke-width='.5'/><text x='16' y='82' fill='#9aa3a7' font-size='12'>RX (ui_in[3])</text><path d='M153.43 71H156.9L156.9 85H163.8L163.8 71H170.7L170.7 85H219.01L219.01 71H225.91L225.91 85H246.61L246.61 71H253.51L253.51 85H288.02L288.02 71H294.92L294.92 85H308.72L308.72 71H315.62L315.62 85H322.52L322.52 71H329.42L329.42 85H350.12L350.12 71H363.93L363.93 85H377.73L377.73 71H384.63L384.63 85H398.43L398.43 71H412.23L412.23 85H419.13L419.13 71H432.93L432.93 85H439.83L439.83 71H446.74L446.74 85H495.04L495.04 71H501.94L501.94 85H564.05L564.05 71H838.7L838.7 85H852.5L852.5 71H859.4L859.4 85H866' fill='none' stroke='#6ea8f0' stroke-width='2'/><line x1='150' y1='114' x2='866' y2='114' stroke='#2c3337' stroke-width='.5'/><text x='16' y='106' fill='#9aa3a7' font-size='12'>TX (uo_out[4])</text><path d='M153.43 95H567.58L567.58 109H581.38L581.38 95H595.18L595.18 109H629.69L629.69 95H866' fill='none' stroke='#6
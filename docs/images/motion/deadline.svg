Z' fill='#161a1d' stroke='#e68db3'/><text x='297.51' y='154' fill='#e8ebe9' font-size='11' font-family='ui-monospace,SFMono-Regular,Consolas,Menlo,monospace'>CMP0</text><line x1='150' y1='186' x2='866' y2='186' stroke='#2c3337' stroke-width='.5'/><text x='16' y='178' fill='#9aa3a7' font-size='12'>deadline 0</text><path d='M153.43 174.0L156.43 167H564.56L567.56 174.0L564.56 181H156.43Z' fill='#161a1d' stroke='#3fc49b'/><text x='159.43' y='178' fill='#e8ebe9' font-size='11' font-family='ui-monospace,SFMono-Regular,Consolas,Menlo,monospace'>0x00000000</text><path d='M567.56 174.0L570.56 167H863L866 174.0L863 181H570.56Z' fill='#161a1d' stroke='#3fc49b'/><text x='573.56' y='178' fill='#e8ebe9' font-size='11' font-family='ui-monospace,SFMono-Regular,Consolas,Menlo,monospace'>0x0001B28A</text><line x1='150' y1='210' x2='866' y2='210' stroke='#2c3337' stroke-width='.5'/><text x='16' y='202' fill='#9aa3a7' font-size='12'>armed 0</text><path d='M153.43 205H567.56L567.56 191H838.25L838.25 205H866' fill='none' stroke='#6ea8f0' stroke-width='2'/><line x1='150' y1='234' x2='866' y2='234' stroke='#2c3337' stroke-width='.5'/><text x='16' y='226' fill='#9aa3a7' font-size='12'>TRIG0 (uo_out[0])</text><path d='M153.43 229H838.25L838.25 215H838.38L838.38 229H866' fill='none' stroke='#6ea8f0' stroke-width='2'/><line x1='150' y1='258' x2='866' y2='258' stroke='#2c3337' stroke-width='.5'/><text x='16' y='250' fill='#9aa3a7' font-size='12'>host → chip</text><rect x='156.9' y='238' width='69.01' height='16' rx='3' fill='#161a1d' stroke='#6ea8f0'/><text x='160.9' y='250' fill='#e8ebe9' font-size='11' font-family='ui-monospace,SFMono-Regular,Consolas,Menlo,monospace'>01</text><rect x='225.91' y='238' width='69.01' height='16' rx='3' fill='#161a1d' stroke='#6ea8f0'/><text x='229.91' y='250' fill='#e8ebe9' font-size='11' font-family='ui-monospace,SFMono-Regular,Consolas,Menlo,monospace'>04</text><rect x='294.92' y='238' width='69.01' height='16' rx='3' fill='#161a1d' stroke='#6ea8f0'/><text x='298.92' y='250' fill='#e8ebe9' font-size='11' font-family='ui-monospace,SFMono-Regular,Consolas,Menlo,monospace'>8A</text><rect x='363.93' y='238' width='69.01' height='16' rx='3' fill='#161a1d' stroke='#6ea8f0'/><text x='367.93' y='250' fill='#e8ebe9' font-size='11' font-family='ui-monospace,SFMono-Regular,Consolas,Menlo,monospace'>B2</text><rect x='432.93' y='238' width='69.01' height='16' rx='3' fill='#161a1d' stroke='#6ea8f0'/><text x='436.93' y='250' fill='#e8ebe9' font-size='11' font-family='ui-monospace,SFMono-Regular,Consolas,Menlo,monospace'>01</text><rect x='501.94' y='238' width='69.01' height='16' rx='3' fill='#161a1d' stroke='#6ea8f0'/><text x='505.94' y='250' fill='#e8ebe9' font-size='11' font-family='ui-monospace,SFMono-Regular,Consolas,Menlo,monospace'>00</text><rect x='838.7' y='238' width='27.3' height='16' rx='3' fill='#161a1d' stroke='#6ea8f0'/><text x='842.7' y='250' fill='#e8ebe9' font-size='11' font-family='ui-monospace,SFMono-Regular,Consolas,Menlo,monospace'>02</text><line x1='150' y1='282' x2='866' y2='282' stroke='#2c3337' stroke-width='.5'/><text x='16' y='274' fill='#9aa3a7' font-size='12'>chip → host</text><rect x='567.58' y='262' width='69.01' height='16' rx='3' fill='#161a1d' stroke='#e3a440'/><text x='571.58' y='274' fill='#e8ebe9' font-size='11' font-family='ui-monospace,SFMono-Regular,Consolas,Menlo,monospace'>06</text><line x1='838.25' y1='62' x2='838.25' y2='282' stroke='#9aa3a7' stroke-dasharray='3 3'/><text x='835.25' y='295' text-anchor='end' fill='#9aa3a7' font-size='11'>deadline tick</text><rect class='m-deadline-curtain' visibility='hidden' x='150' y='60' width='732' height='238' fill='#0f1214'/><line class='m-deadline-cur' visibility='hidden' x1='150' y1='60' x2='150' y2='282' stroke='#ff7d47' stroke-width='2'/><rect x='0' y='304' width='880' height='84' rx='12' fill='#161a1d'/><rect x='0' y='304' width='880' height='12' fill='#161a1d'/><text class='m-deadline-sum' x='16' y='326' fill='#e8ebe9' font-size='13'><tspan x='16' dy='0'>Write CMP0 over the serial port and the trigger pin rises on exactly that tick, 8 ticks wide, with nothing on the</tspan><tspan x='16' dy='18'>wire.</tspan></text><text class='m-deadline-cap m-deadline-c0' visibility='hidden' x='16' y='326' fill='#e8ebe9' font-size='13'><tspan x='16' dy='0'>Host sends 01 04 8A B2 01 00: write CMP0 = 0x0001B28A.</tspan></text><text class='m-deadline-cap m-deadline-c1' visibility='hidden' x='16' y='326' fill='#e8ebe9' font-size='13'><tspan x='16' dy='0'>H_DO: one clock on the register port, offset 4 (CMP0).</tspan></text><text class='m-deadline-cap m-deadline-c2' visibility='hidden' x='16' y='326' fill='#e8ebe9' font-size='13'><tspan x='16' dy='0'>armed[0] goes high on the H_DO clock: channel 0 now waits for tick 111242 (the TIME read + 60000).</tspan></text><text class='m-deadline-cap m-deadline-c3' visibility='hidden' x='16' y='326' fill='#e8ebe9' font-size='13'><tspan x='16' dy='0'>The chip answers 06.</tspan></text><text class='m-deadline-cap m-deadline-c4' visibility='hidden' x='16' y='326' fill='#e8ebe9' font-size='13'><tspan x='16' dy='0'>Tick 111242: TRIG0 (uo_out[0]) rises on exactly the deadline tick. No host is involved; the ACK went out long ago.</tspan></text><text class='m-deadline-cap m-deadline-c5' visibility='hidden' x='16' y='326' fill='#e8ebe9' font-size='13'><tspan x='16' dy='0'>TRIG0 falls 8 ticks later: the default pulse width of 8. armed[0] cleared when it fired, so it fires once.</tspan></text></svg>

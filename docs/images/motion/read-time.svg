fill='#0f1214'/><line class='m-read-time-cur' visibility='hidden' x1='150' y1='60' x2='150' y2='282' stroke='#ff7d47' stroke-width='2'/><rect x='0' y='304' width='880' height='84' rx='12' fill='#161a1d'/><rect x='0' y='304' width='880' height='12' fill='#161a1d'/><text class='m-read-time-sum' x='16' y='326' fill='#e8ebe9' font-size='13'><tspan x='16' dy='0'>A two-byte read and its four-byte answer, least significant byte first: the value is the timebase on the one clock the</tspan><tspan x='16' dy='18'>port touched the register.</tspan></text><text class='m-read-time-cap m-read-time-c0' visibility='hidden' x='16' y='326' fill='#e8ebe9' font-size='13'><tspan x='16' dy='0'>Host sends 02 00: read TIME.</tspan></text><text class='m-read-time-cap m-read-time-c1' visibility='hidden' x='16' y='326' fill='#e8ebe9' font-size='13'><tspan x='16' dy='0'>H_DO: one clock on the register port, offset 0 (TIME). The timebase reads 51242 at this clock, and that exact value is</tspan><tspan x='16' dy='18'>what goes back.</tspan></text><text class='m-read-time-cap m-read-time-c2' visibility='hidden' x='16' y='326' fill='#e8ebe9' font-size='13'><tspan x='16' dy='0'>The chip answers 2A C8 00 00, least significant byte first: 0x0000C82A.</tspan></text><text class='m-read-time-cap m-read-time-c3' visibility='hidden' x='16' y='326' fill='#e8ebe9' font-size='13'><tspan x='16' dy='0'>Four bytes have gone out; the host reassembles them, lowest first. By the time the last stop bit ends, 17365 clocks</tspan><tspan x='16' dy='18'>after the read, the timebase has moved on: the answer is a timestamp of the read, not of the moment it arrives.</tspan></text></svg>

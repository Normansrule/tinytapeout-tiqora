'/><text x='574.6' y='178' fill='#e8ebe9' font-size='11' font-family='ui-monospace,SFMono-Regular,Consolas,Menlo,monospace'>2</text><path d='M738.08 174.0L741.08 167H775.07L778.07 174.0L775.07 181H741.08Z' fill='#161a1d' stroke='#3fc49b'/><text x='744.08' y='178' fill='#e8ebe9' font-size='11' font-family='ui-monospace,SFMono-Regular,Consolas,Menlo,monospace'>0</text><rect x='778.07' y='167' width='0.5' height='14' fill='#3fc49b' opacity='.35'/><path d='M778.08 174.0L781.08 167H816.95L819.95 174.0L816.95 181H781.08Z' fill='#161a1d' stroke='#3fc49b'/><text x='784.08' y='178' fill='#e8ebe9' font-size='11' font-family='ui-monospace,SFMono-Regular,Consolas,Menlo,monospace'>1</text><path d='M819.95 174.0L822.95 167H863L866 174.0L863 181H822.95Z' fill='#161a1d' stroke='#3fc49b'/><text x='825.95' y='178' fill='#e8ebe9' font-size='11' font-family='ui-monospace,SFMono-Regular,Consolas,Menlo,monospace'>0</text><line x1='150' y1='210' x2='866' y2='210' stroke='#2c3337' stroke-width='.5'/><text x='16' y='202' fill='#9aa3a7' font-size='12'>register access</text><path d='M152.08 205H866' fill='none' stroke='#6ea8f0' stroke-width='2'/><line x1='150' y1='234' x2='866' y2='234' stroke='#2c3337' stroke-width='.5'/><text x='16' y='226' fill='#9aa3a7' font-size='12'>host → chip</text><rect x='154.19' y='214' width='41.86' height='16' rx='3' fill='#161a1d' stroke='#6ea8f0'/><text x='158.19' y='226' fill='#e8ebe9' font-size='11' font-family='ui-monospace,SFMono-Regular,Consolas,Menlo,monospace'>7E</text><rect x='235.81' y='214' width='41.86' height='16' rx='3' fill='#161a1d' stroke='#6ea8f0'/><text x='239.81' y='226' fill='#e8ebe9' font-size='11' font-family='ui-monospace,SFMono-Regular,Consolas,Menlo,monospace'>01</text><rect x='277.66' y='214' width='41.86' height='16' rx='3' fill='#161a1d' stroke='#6ea8f0'/><text x='281.66' y='226' fill='#e8ebe9' font-size='11' font-family='ui-monospace,SFMono-Regular,Consolas,Menlo,monospace'>07</text><rect x='319.52' y='214' width='41.86' height='16' rx='3' fill='#161a1d' stroke='#6ea8f0'/><text x='323.52' y='226' fill='#e8ebe9' font-size='11' font-family='ui-monospace,SFMono-Regular,Consolas,Menlo,monospace'>20</text><rect x='528.8' y='214' width='41.86' height='16' rx='3' fill='#161a1d' stroke='#6ea8f0'/><text x='532.8' y='226' fill='#e8ebe9' font-size='11' font-family='ui-monospace,SFMono-Regular,Consolas,Menlo,monospace'>03</text><rect x='738.27' y='214' width='41.86' height='16' rx='3' fill='#161a1d' stroke='#6ea8f0'/><text x='742.27' y='226' fill='#e8ebe9' font-size='11' font-family='ui-monospace,SFMono-Regular,Consolas,Menlo,monospace'>03</text><rect x='859.72' y='214' width='6.28' height='16' rx='3' fill='#161a1d' stroke='#6ea8f0'/><line x1='150' y1='258' x2='866' y2='258' stroke='#2c3337' stroke-width='.5'/><text x='16' y='250' fill='#9aa3a7' font-size='12'>chip → host</text><rect x='193.99' y='238' width='41.86' height='16' rx='3' fill='#161a1d' stroke='#e3a440'/><text x='197.99' y='250' fill='#e8ebe9' font-size='11' font-family='ui-monospace,SFMono-Regular,Consolas,Menlo,monospace'>15</text><rect x='778.08' y='238' width='41.86' height='16' rx='3' fill='#161a1d' stroke='#e3a440'/><text x='782.08' y='250' fill='#e8ebe9' font-size='11' font-family='ui-monospace,SFMono-Regular,Consolas,Menlo,monospace'>5A</text><rect x='819.95' y='238' width='41.86' height='16' rx='3' fill='#161a1d' stroke='#e3a440'/><text x='823.95' y='250' fill='#e8ebe9' font-size='11' font-family='ui-monospace,SFMono-Regular,Consolas,Menlo,monospace'>01</text><line x1='738.08' y1='62' x2='738.08' y2='258' stroke='#9aa3a7' stroke-dasharray='3 3'/><text x='741.08' y='271' text-anchor='start' fill='#9aa3a7' font-size='11'>reset</text><rect class='m-errors-curtain' visibility='hidden' x='150' y='60' width='732' height='214' fill='#0f1214'/><line class='m-errors-cur' visibility='hidden' x1='150' y1='60' x2='150' y2='258' stroke='#ff7d47' stroke-width='2'/><rect x='0' y='280' width='880' height='84' rx='12' fill='#161a1d'/><rect x='0' y='280' width='880' height='12' fill='#161a1d'/><text class='m-errors-sum' x='16' y='302' fill='#e8ebe9' font-size='13'><tspan x='16' dy='0'>An unknown command gets NAK; a command cut off part way gets nothing at all, swallows the next command, and only reset</tspan><tspan x='16' dy='18'>recovers.</tspan></text><text class='m-errors-cap m-errors-c0' visibility='hidden' x='16' y='302' fill='#e8ebe9' font-size='13'><tspan x='16' dy='0'>Host sends 7E: unknown 0x7E.</tspan></text><text class='m-errors-cap m-errors-c1' visibility='hidden' x='16' y='302' fill='#e8ebe9' font-size='13'><tspan x='16' dy='0'>The chip answers 15, NAK: not a command it knows. The port is back in H_CMD and nothing else changed.</tspan></text><text class='m-errors-cap m-errors-c2' visibility='hidden' x='16' y='302' fill='#e8ebe9' font-size='13'><tspan x='16' dy='0'>Host sends 01 07 20: a write cut off after its address and one data byte. The port is in H_DATA with 3 bytes to go,</tspan><tspan x='16' dy='18'>and it has no timeout.</tspan></text><text class='m-errors-cap m-errors-c3' visibility='hidden' x='16' y='302' fill='#e8ebe9' font-size='13'><tspan x='16' dy='0'>The host gives up and pings (03). The port takes it as the second data byte: no reply. A host that loses sync sees</tspan><tspan x='16' dy='18'>silence, not an error.</tspan></text><text class='m-errors-cap m-errors-c4' visibility='hidden' x='16' y='302' fill='#e8ebe9' font-size='13'><tspan x='16' dy='0'>Reset (rst_n low) is the only thing that clears it. The rest of the chip resets too: timebase, queue and comparators.</tspan></text><text class='m-errors-cap m-errors-c5' visibility='hidden' x='16' y='302' fill='#e8ebe9' font-size='13'><tspan x='16' dy='0'>Host sends 03: ping.</tspan></text><text class='m-errors-cap m-errors-c6' visibility='hidden' x='16' y='302' fill='#e8ebe9' font-size='13'><tspan x='16' dy='0'>After reset the ping answers 5A 01 again.</tspan></text></svg>

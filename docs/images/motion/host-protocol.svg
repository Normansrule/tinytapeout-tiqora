'M716.38 150.0L719.38 143H784.61L787.61 150.0L784.61 157H719.38Z' fill='#161a1d' stroke='#3fc49b'/><text x='722.38' y='154' fill='#e8ebe9' font-size='11' font-family='ui-monospace,SFMono-Regular,Consolas,Menlo,monospace'>1</text><rect x='787.61' y='143' width='0.5' height='14' fill='#3fc49b' opacity='.35'/><path d='M787.64 150.0L790.64 143H863L866 150.0L863 157H790.64Z' fill='#161a1d' stroke='#3fc49b'/><text x='793.64' y='154' fill='#e8ebe9' font-size='11' font-family='ui-monospace,SFMono-Regular,Consolas,Menlo,monospace'>0</text><line x1='150' y1='186' x2='866' y2='186' stroke='#2c3337' stroke-width='.5'/><text x='16' y='178' fill='#9aa3a7' font-size='12'>register access</text><path d='M156.79 181H787.61L787.61 167H787.62L787.62 181H866' fill='none' stroke='#6ea8f0' stroke-width='2'/><line x1='150' y1='210' x2='866' y2='210' stroke='#2c3337' stroke-width='.5'/><text x='16' y='202' fill='#9aa3a7' font-size='12'>register</text><path d='M156.79 198.0L159.79 191H499.72L502.72 198.0L499.72 205H159.79Z' fill='#161a1d' stroke='#e68db3'/><text x='162.79' y='202' fill='#e8ebe9' font-size='11' font-family='ui-monospace,SFMono-Regular,Consolas,Menlo,monospace'>TIME</text><path d='M502.72 198.0L505.72 191H863L866 198.0L863 205H505.72Z' fill='#161a1d' stroke='#e68db3'/><text x='508.72' y='202' fill='#e8ebe9' font-size='11' font-family='ui-monospace,SFMono-Regular,Consolas,Menlo,monospace'>CFG</text><line x1='150' y1='234' x2='866' y2='234' stroke='#2c3337' stroke-width='.5'/><text x='16' y='226' fill='#9aa3a7' font-size='12'>host → chip</text><rect x='157.12' y='214' width='71.22' height='16' rx='3' fill='#161a1d' stroke='#6ea8f0'/><text x='161.12' y='226' fill='#e8ebe9' font-size='11' font-family='ui-monospace,SFMono-Regular,Consolas,Menlo,monospace'>03</text><rect x='363.78' y='214' width='71.22' height='16' rx='3' fill='#161a1d' stroke='#6ea8f0'/><text x='367.78' y='226' fill='#e8ebe9' font-size='11' font-family='ui-monospace,SFMono-Regular,Consolas,Menlo,monospace'>01</text><rect x='435.01' y='214' width='71.22' height='16' rx='3' fill='#161a1d' stroke='#6ea8f0'/><text x='439.01' y='226' fill='#e8ebe9' font-size='11' font-family='ui-monospace,SFMono-Regular,Consolas,Menlo,monospace'>03</text><rect x='506.23' y='214' width='71.22' height='16' rx='3' fill='#161a1d' stroke='#6ea8f0'/><text x='510.23' y='226' fill='#e8ebe9' font-size='11' font-family='ui-monospace,SFMono-Regular,Consolas,Menlo,monospace'>01</text><rect x='577.45' y='214' width='71.22' height='16' rx='3' fill='#161a1d' stroke='#6ea8f0'/><text x='581.45' y='226' fill='#e8ebe9' font-size='11' font-family='ui-monospace,SFMono-Regular,Consolas,Menlo,monospace'>00</text><rect x='648.67' y='214' width='71.22' height='16' rx='3' fill='#161a1d' stroke='#6ea8f0'/><text x='652.67' y='226' fill='#e8ebe9' font-size='11' font-family='ui-monospace,SFMono-Regular,Consolas,Menlo,monospace'>00</text><rect x='719.9' y='214' width='71.22' height='16' rx='3' fill='#161a1d' stroke='#6ea8f0'/><text x='723.9' y='226' fill='#e8ebe9' font-size='11' font-family='ui-monospace,SFMono-Regular,Consolas,Menlo,monospace'>00</text><rect x='858.78' y='214' width='7.22' height='16' rx='3' fill='#161a1d' stroke='#6ea8f0'/><line x1='150' y1='258' x2='866' y2='258' stroke='#2c3337' stroke-width='.5'/><text x='16' y='250' fill='#9aa3a7' font-size='12'>chip → host</text><rect x='224.87' y='238' width='71.22' height='16' rx='3' fill='#161a1d' stroke='#e3a440'/><text x='228.87' y='250' fill='#e8ebe9' font-size='11' font-family='ui-monospace,SFMono-Regular,Consolas,Menlo,monospace'>5A</text><rect x='296.1' y='238' width='71.22' height='16' rx='3' fill='#161a1d' stroke='#e3a440'/><text x='300.1' y='250' fill='#e8ebe9' font-size='11' font-family='ui-monospace,SFMono-Regular,Consolas,Menlo,monospace'>01</text><rect x='787.64' y='238' width='71.22' height='16' rx='3' fill='#161a1d' stroke='#e3a440'/><text x='791.64' y='250' fill='#e8ebe9' font-size='11' font-family='ui-monospace,SFMono-Regular,Consolas,Menlo,monospace'>06</text><line x1='363.78' y1='62' x2='363.78' y2='258' stroke='#9aa3a7' stroke-dasharray='3 3'/><text x='366.78' y='271' text-anchor='start' fill='#9aa3a7' font-size='11'>write</text><rect class='m-host-protocol-curtain' visibility='hidden' x='150' y='60' width='732' height='214' fill='#0f1214'/><line class='m-host-protocol-cur' visibility='hidden' x1='150' y1='60' x2='150' y2='258' stroke='#ff7d47' stroke-width='2'/><rect x='0' y='280' width='880' height='84' rx='12' fill='#161a1d'/><rect x='0' y='280' width='880' height='12' fill='#161a1d'/><text class='m-host-protocol-sum' x='16' y='302' fill='#e8ebe9' font-size='13'><tspan x='16' dy='0'>The whole host protocol in two commands: a ping and its two-byte answer, then a six-byte write that configures capture</tspan><tspan x='16' dy='18'>and is ACKed.</tspan></text><text class='m-host-protocol-cap m-host-protocol-c0' visibility='hidden' x='16' y='302' fill='#e8ebe9' font-size='13'><tspan x='16' dy='0'>Host sends 03: ping. One byte: a start bit (low), eight data bits least significant first, a stop bit (high), 434</tspan><tspan x='16' dy='18'>clocks each.</tspan></text><text class='m-host-protocol-cap m-host-protocol-c1' visibility='hidden' x='16' y='302' fill='#e8ebe9' font-size='13'><tspan x='16' dy='0'>H_SEND with 2 bytes to go: 0x5A (the magic) and 0x01 (the version). The reply is shifted out of the same 32-bit</tspan><tspan x='16' dy='18'>register that collects write data.</tspan></text><text class='m-host-protocol-cap m-host-protocol-c2' visibility='hidden' x='16' y='302' fill='#e8ebe9' font-size='13'><tspan x='16' dy='0'>The chip answers 5A 01.</tspan></text><text class='m-host-protocol-cap m-host-protocol-c3' visibility='hidden' x='16' y='302' fill='#e8ebe9' font-size='13'><tspan x='16' dy='0'>Host sends 01 03 01 00 00 00: write CFG = 0x00000001.</tspan></text><text class='m-host-protocol-cap m-host-protocol-c4' visibility='hidden' x='16' y='302' fill='#e8ebe9' font-size='13'><tspan x='16' dy='0'>H_DATA: four data bytes to collect, least significant first; each one shifts in at the top of the register.</tspan></text><text class='m-host-protocol-cap m-host-protocol-c5' visibility='hidden' x='16' y='302' fill='#e8ebe9' font-size='13'><tspan x='16' dy='0'>H_DO: one clock on the register port, offset 3 (CFG).</tspan></text><text class='m-host-protocol-cap m-host-protocol-c6' visibility='hidden' x='16' y='302' fill='#e8ebe9' font-size='13'><tspan x='16' dy='0'>The chip answers 06.</tspan></text></svg>

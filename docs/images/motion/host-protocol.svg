<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 880 364' width='880' height='364' role='img' aria-labelledby='m-host-protocol-t m-host-protocol-d' font-family='system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif'><title id='m-host-protocol-t'>Ping, then a register write</title><desc id='m-host-protocol-d'>The whole host protocol in two commands: a ping and its two-byte answer, then a six-byte write that configures capture and is ACKed. Recorded from an RTL simulation, not computed in the browser. Made by docs/tools/motion.py from docs/site/data/traces/host-protocol.json.</desc><style>@keyframes m-host-protocol-sweep{0.00%{transform:translateX(0.0px);animation-timing-function:ease-in-out}2.46%{transform:translateX(10.1px)}11.58%{transform:translateX(10.1px);animation-timing-function:ease-in-out}14.04%{transform:translateX(77.9px)}23.16%{transform:translateX(77.9px);animation-timing-function:ease-in-out}25.61%{transform:translateX(77.9px)}34.74%{transform:translateX(77.9px);animation-timing-function:ease-in-out}37.19%{transform:translateX(216.8px)}46.32%{transform:translateX(216.8px);animation-timing-function:ease-in-out}48.77%{transform:translateX(355.7px)}57.89%{transform:translateX(355.7px);animation-timing-function:ease-in-out}60.35%{transform:translateX(640.6px)}69.47%{transform:translateX(640.6px);animation-timing-function:ease-in-out}71.93%{transform:translateX(640.7px)}81.05%{transform:translateX(640.7px);animation-timing-function:ease-in-out}85.96%{transform:translateX(716.0px)}99.6%{transform:translateX(716.0px)}100%{transform:translateX(0)}}@media (prefers-reduced-motion:no-preference){.m-host-protocol-sum{visibility:hidden}.m-host-protocol-cap,.m-host-protocol-cur,.m-host-protocol-curtain{visibility:visible}.m-host-protocol-cap{opacity:0}.m-host-protocol-curtain,.m-host-protocol-cur{animation:m-host-protocol-sweep 28.50s infinite}@keyframes m-host-protocol-c0{0%,2.46%{opacity:0}2.98%,13.86%{opacity:1}14.04%,100%{opacity:0}}.m-host-protocol-c0{animation:m-host-protocol-c0 28.50s infinite}@keyframes m-host-protocol-c1{0%,14.04%{opacity:0}14.56%,25.44%{opacity:1}25.61%,100%{opacity:0}}.m-host-protocol-c1{animation:m-host-protocol-c1 28.50s infinite}@keyframes m-host-protocol-c2{0%,25.61%{opacity:0}26.14%,37.02%{opacity:1}37.19%,100%{opacity:0}}.m-host-protocol-c2{animation:m-host-protocol-c2 28.50s infinite}@keyframes m-host-protocol-c3{0%,37.19%{opacity:0}37.72%,48.60%{opacity:1}48.77%,100%{opacity:0}}.m-host-protocol-c3{animation:m-host-protocol-c3 28.50s infinite}@keyframes m-host-protocol-c4{0%,48.77%{opacity:0}49.30%,60.18%{opacity:1}60.35%,100%{opacity:0}}.m-host-protocol-c4{animation:m-host-protocol-c4 28.50s infinite}@keyframes m-host-protocol-c5{0%,60.35%{opacity:0}60.88%,71.75%{opacity:1}71.93%,100%{opacity:0}}.m-host-protocol-c5{animation:m-host-protocol-c5 28.50s infinite}@keyframes m-host-protocol-c6{0%,71.93%{opacity:0}72.46%,99.82%{opacity:1}100.00%,100%{opacity:0}}.m-host-protocol-c6{animation:m-host-protocol-c6 28.50s infinite}}</style><rect width='880' height='364' rx='12' fill='#0f1214'/><text x='16' y='26' fill='#e8ebe9' font-size='16' font-weight='700'>Ping, then a register write</text><text x='16' y='46' fill='#9aa3a7' font-size='12'>cycles -418 to 43211 · 872.60 µs at 50 MHz</text><rect x='672.4' y='12' width='193.6' height='20' rx='10' fill='none' stroke='#6ea8f0'/><text x='769.2' y='26' text-anchor='middle' fill='#6ea8f0' font-size='11'>Recorded from RTL simulation</text><line x1='150' y1='90' x2='866' y2='90' stroke='#2c3337' stroke-width='.5'/><text x='16' y='82' fill='#9aa3a7' font-size='12'>RX (ui_in[3])</text><path d='M156.79 71H157.12L157.12 85H164.24L164.24 71H178.49L178.49 85H221.22L221.22 71H363.78L363.78 85H370.9L370.9 71H378.03L378.03 85H427.88L427.88 71H435.01L435.01 85H442.13L442.13 71H456.37L456.37 85H499.11L499.11 71H506.23L506.23 85H513.35L513.35 71H520.47L520.47 85H570.33L570.33 71H577.45L577.45 85H641.55L641.55 71H648.67L648.67 85H712.77L712.77 71H719.9L719.9 85H78
# openframe-sky130 — Tiqora-Serial as the whole chip in the Efabless
# Openframe padframe: 44 GPIO, no management core, the same frame Tiny
# Tapeout's sky130 chips are built in.
#
# Two hardening stages, as for Caravel: tiqora_serial_openframe_core (all
# logic, including each pad's digital mode) and openframe_project_wrapper
# (wiring). Pads follow the openframe example SoC where it has the same
# function: clock on 38, UART on 5/6.
name = "openframe-sky130"
kind = "carrier"
summary = "Openframe padframe, Tiqora-Serial is the whole chip (44 GPIO)"
pdk = "sky130A"

[design]
files = ["src/targets/tiqora_serial_macro.sv"]
clock_period_ns = 20.0
io_delay_pct = 20

[floorplan]
die_um = [270, 270]
density_pct = 60
max_util_pct = 45

[signoff]
setup_min_ns = 0.0
hold_min_ns = 0.0
max_util_pct = 70

[librelane]
SYNTH_EXCLUDED_CELL_FILE = "dir::../../src/synth_exclude.cells"
CTS_SINK_CLUSTERING_SIZE = 10
RT_MAX_LAYER = "met4"
PDN_MULTILAYER = 0

[carrier]
frame = "openframe"
macro = "tiqora_serial_macro"
core = "tiqora_serial_openframe_core"
instance = "tiqora"
location_um = [550, 1990]       # where the openframe example places its SoC (macro.cfg)
clock = "pad 38"
reset_n = ["resetb_l", "porb_l"]
pins = [
  { pad = 5,  in = "uart_rx" },
  { pad = 6,  out = "uart_tx" },
  { pad = 16, in = "cap_in[0]" },
  { pad = 17, in = "cap_in[1]" },
  { pad = 18, in = "cap_in[2]" },
  { pad = 19, in = "cap_in[3]" },
  { pad = 20, in = "cap_in[4]" },
  { pad = 21, in = "cap_in[5]" },
  { pad = 22, in = "cap_in[6]" },
  { pad = 23, in = "cap_in[7]" },
  { pad = 24, out = "trig_out[0]" },
  { pad = 25, out = "trig_out[1]" },
  { pad = 26, out = "trig_out[2]" },
  { pad = 27, out = "evt_pending" },
  { pad = 28, out = "ovf" },
  { pad = 29, out = "heartbeat" },
  { pad = 30, out = "evt_pulse" },
  { pad = 31, out = "uart_active" },
  { pad = 32, out = "ev_chan[0]" },
  { pad = 33, out = "ev_chan[1]" },
  { pad = 34, out = "ev_chan[2]" },
  { pad = 35, out = "ev_edge" },
  { pad = 36, out = "ev_count[0]" },
  { pad = 37, out = "ev_count[1]" },
]
